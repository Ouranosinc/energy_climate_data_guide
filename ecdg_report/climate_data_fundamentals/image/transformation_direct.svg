<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 270" role="img"><title>Direct use: pass the same dataset to the next step</title><desc>The input may already have been processed.</desc><rect width="1000" height="270" fill="white"/><g font-family="Arial, sans-serif"><text x="26" y="34" font-size="25" fill="#263746" text-anchor="start">Direct use: pass the same dataset to the next step</text><rect x="35" y="85" width="260" height="95" rx="8" fill="#f1f6f9" stroke="#bdcbd5"/><text x="165" y="121" font-size="23" fill="#176b91" text-anchor="middle">Existing dataset</text><text x="165" y="153" font-size="22" fill="#176b91" text-anchor="middle">10, 12, 9, ...</text><text x="325" y="142" font-size="34" fill="#263746" text-anchor="start">→</text><rect x="380" y="85" width="240" height="95" rx="8" fill="#f1f6f9" stroke="#bdcbd5"/><text x="500" y="123" font-size="23" fill="#263746" text-anchor="middle">No further</text><text x="500" y="153" font-size="23" fill="#263746" text-anchor="middle">transformation</text><text x="654" y="142" font-size="34" fill="#263746" text-anchor="start">→</text><rect x="710" y="85" width="255" height="95" rx="8" fill="#f1f6f9" stroke="#bdcbd5"/><text x="837" y="121" font-size="21" fill="#263746" text-anchor="middle">Next model / analysis</text><text x="837" y="153" font-size="22" fill="#176b91" text-anchor="middle">10, 12, 9, ...</text><text x="500" y="230" font-size="18" fill="#263746" text-anchor="middle">The input may already have been processed.</text><text x="500" y="256" font-size="16" fill="#697581" text-anchor="middle">Illustrative only: synthetic data and selected assumptions</text></g></svg>
